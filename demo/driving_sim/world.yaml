# Synthetic spacious arena. URDF visual/sensor geometry and production planner/controller code are real inputs.
arena: {width: 6.0, height: 4.0, resolution: 0.02, wall_thickness: 0.10, border: 0.20}
map_file: map.yaml
urdf: ../../src/craft_description/urdf/v307_full_robot.urdf
start: [0.65, 0.65, 0.0]
goals:
  - [5.30, 0.65, 1.57079632679]
  - [5.30, 3.30, 3.14159265359]
  - [0.65, 3.30, -1.57079632679]
  - [0.65, 0.65, 0.0]
# These rectangles are baked into map.pgm. Dynamic box is NOT in the planner map.
static_rectangles:
