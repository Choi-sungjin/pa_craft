  - {name: known_B, x: 3.4, y: 2.90, width: 0.60, depth: 0.60, height: 0.50}
  - {name: known_C, x: 1.6, y: 2.00, width: 0.60, depth: 0.70, height: 0.50}
dynamic: {enabled: false, x: 3.0, y: 1.5, width: 0.25, depth: 0.25, height: 0.25}
auto_obstacle_after_m: 0.80
repeat: true
lidar:
