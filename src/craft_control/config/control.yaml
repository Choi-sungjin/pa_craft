# ControlMaster reads these parameters and passes them to the actuator controllers.
# ros2 run craft_control control_master --ros-args --params-file $(ros2 pkg prefix craft_control)/share/craft_control/config/control.yaml
# Every OpenCR reports the same USB serial (FFFFFFFEFFFF), so ttyACM0/1 order is not fixed and by-id
# cannot tell them apart. Install config/udev/99-craft-opencr.rules; keep USB ports fixed.

control_master:
  ros__parameters:
    wheel_heading_tolerance: 0.5
    wheel_rotate_angular_speed: 0.6  # [rad/s] in-place turn before tracking/final alignment
    settle_time_s: 0.1
    stop_position_tolerance_rad: 0.002
    wheel_stop_tolerance_rad_s: 0.02
    task_timeout_s: 60.0  # [s] matches planning fsm.execution_timeout_s (was 30: timed out on ~3 m legs at the real, slipping speed)
    odom_timeout_s: 0.5
    arm_lm_port: /dev/opencr_arm_lm    # LM + four rotational arm motors + gripper OpenCR
    clock_wheel_port: /dev/opencr_wheel_clock  # clock + wheel x2 OpenCR

    # /planning/hold is a live heartbeat: true or missing/stale input holds every axis.
    # Resume requires fresh false, /control/planning_held=false, then new targets.
    planning_watchdog_timeout_s: 0.5
    require_planning_heartbeat: true
    # Each OpenCR must supply a valid sample within this steady-clock interval.
    # A previously seen board that times out reports state=2 until fresh feedback returns.
    serial_feedback_timeout_s: 0.5

    # TurtleBot3 Waffle Pi drive parameters.
    wheel_radius: 0.033  # [m] nominal Waffle Pi wheel radius
    wheel_separation: 0.288  # [m] left/right wheel center-to-center distance
    # Wheel dead reckoning -> /control/wheel/odom. robot_localization (craft_perception/config/ekf.yaml)
    # fuses it with /control/imu/data and owns odom->base_link, so publish_odom_tf stays false then.
    odom_frame: odom
    base_frame: base_link
    publish_odom_tf: false
    # Rough floor: wheels slip, so trust wheel speed loosely and wheel yaw rate barely (EKF ignores it).
    wheel_vx_variance: 0.0025      # [(m/s)^2] ~0.05 m/s std
    wheel_vyaw_variance: 0.25      # [(rad/s)^2]
    # OpenCR on-board IMU (raw board frame). Mounting incl. upside-down is the bringup TF.
    imu_frame: imu_link
    imu_gyro_variance: 0.0001      # [(rad/s)^2] ~0.01 rad/s std; IMU yaw rate is the trusted source
    # Residual gz offset left after the firmware's power-up zero calibration [rad/s], board frame.
    # Measure: robot still, average /control/imu/data angular_velocity.z for ~30 s.
    imu_gyro_z_bias: 0.0
    max_v: 0.26           # [m/s] nominal Waffle Pi maximum linear speed
    # Host limits target speed. OpenCR firmware must configure DYNAMIXEL Profile Acceleration(108)
    # and owns the motor velocity PID, feedforward, acceleration profile, and motor-level tracking.
    # Profile Acceleration must be nonzero; zero makes target-velocity changes effectively immediate.
    # Wheels: XM430-W210; project speed cap below (not a guaranteed loaded speed).
    max_wheel: 7.8        # [rad/s] wheel output-shaft speed cap
    # Pure Pursuit tuning: path and odometry must use the same frame, at the axle center.
    lookahead_distance: 0.3  # [m] starting value; tune on the robot
    wheel_goal_tolerance: 0.10  # [m] stop when the path endpoint is within this distance, matches planning goal_tolerance (was 0.03: below SLAM pose noise, overshoot -> 180 deg turn back)
    # Incoming straight path segments are subdivided at path_spacing without changing geometry
    # and republished on /control/tracking_path. Keep it well below lookahead.
    path_spacing: 0.02  # [m]

    # Wheel polarity is corrected in firmware/wheel_clock/config.h:
    # wheel_l ID 1 direction=+1, wheel_r ID 2 direction=-1; hardware Reverse OFF.
    # Both host wheel commands/feedback are positive for forward travel.

    # 12-slot puck storage: slot 12 = 210.0 raw motor degrees, aligned with the loading guide
    # (2026-10-26; was 314.6).
    # Positive motor rotation is CCW viewed from above.
    # Adjacent slots are 30 motor degrees (pi/6 rad); shortest rotation is chosen.
    # OpenCR must accept/report unwrapped motor radians (e.g. 12 -> 7 commands -5*pi/6).
    clock_slot_count: 12
    clock_slot_angle: 0.5235987755982988  # [motor rad/slot] 30 degrees
    clock_zero_angle: 3.665191429188092  # [motor rad] 210.0 degrees, slot 12 at the loading guide
    # Firmware clock zero_tick stays 0: apply this offset here only.
    # Recheck physical alignment after a motor power cycle/multi-turn reset.
    clock_direction: 1.0  # +1: CCW motor rotation increases slot numbers; -1: reverse
    clock_angle_tolerance: 0.03490658503988659  # [rad] 2 degrees; tune alignment tolerance

    # Rotational arm motors only: shoulder, elbow, wrist_pitch, tool_roll [motor rad].
    # Measured degrees: shoulder 39–187, elbow 38–323, wrist_pitch 70.1–340, tool_roll -180–180 (2026-10-26).
    # Limits below keep a 5-degree margin inside those (sync is approximate):
    # shoulder 44–182, elbow 43–318, wrist_pitch 119–235, tool_roll 5–495.
    # Original measured limits [rad]: min [0.6806784082777885, 0.6632251157578453, 1.9896753472735358, 0.0]
    #                                 max [3.263765701229396, 5.6374134839416845, 4.1887902047863905, 8.726646259971648]
    # Rounded inward to 4 decimals: ControlMaster sends '%.4f', and the firmware rejects a whole
    # frame if any value falls outside its limits, so limits must be exactly representable.
    arm_min_angle: [0.7680, 0.7505, 1.3108, -3.0543]
    # elbow / wrist_pitch maxima opened 2026-10-27 for the hand-taught lying-puck grasp (elbow 321.8, wrist 345.1):
    # elbow at the measured 323 deg (was 318), wrist 345.5 deg (was 335; measured 340 had margin).
    arm_max_angle: [3.1764, 5.6374, 6.0301, 3.0543]

    # Rotational part of /ik_solution; ControlMaster routes slide_joint to LmController.
    arm_ik_joint_names: [shoulder_joint, elbow_joint, wrist_pitch_joint, tool_roll_joint]
    arm_ik_mapping_confirmed: true
    # motor_angle = offset + direction * URDF joint angle (hardware Reverse OFF).
    # Directions checked against joint_state_publisher_gui: +1 = URDF + and motor raw + move the same way.
    # Offsets from a pose matched in RViz (2026-10-24): raw [90.4, 178.9, 197.3, 184.2] deg at
    # URDF [0.425, 0.934, 0.221, -1.595] rad. Keep mapping unconfirmed until verified on hardware.
    arm_joint_directions: [1.0, 1.0, -1.0, 1.0]
    # tool_roll: aligned at motor 90.0 deg in the -180..180 frame (2026-10-26; was 275.59 deg).
    arm_joint_offsets: [1.152778, 2.188394, 3.664535, 1.570796]  # [motor rad] 66.05, 125.39, 209.96, 90.00 deg
    arm_angle_tolerance: 0.008726646259971648  # [motor rad] 0.5 degree per joint, matches firmware lm_arm (was 1, before that 2: up to ~9 mm TCP height at the grasp)

    # Independent LM controller: target displacement [m] -> motor angle [rad].
    lm_linear_joint_name: slide_joint
    lm_mapping_confirmed: true
    # Measured -391.8 to 527.5 degrees (-6.838200009313783 to 9.206611804270088 rad) after the LM guide shifted
    # (2026-10-27; was -141.4 to 808.1); 5-degree margin below.
    lm_min_angle: -6.7509  # [motor rad] -386.8 degrees, 4 decimals rounded inward
    lm_max_angle: 9.1193  # [motor rad] 522.5 degrees, 4 decimals rounded inward
    # Motor raw + and URDF slide_joint + (axis -X) both move the carriage toward the LM motor.
    lm_motor_direction: 1.0
    # The earlier reported 317.2-degree zero was withdrawn; do not use it.
    lm_motor_offset: -0.20245819323134223  # [motor rad] -11.6 degrees at slide position zero (measured 2026-10-27)
    # Measured 0.108 m travel over 919.3 degrees of motor rotation (was 949.5).
    lm_meters_per_rad: 0.006731147816178496  # [m/motor rad]; zero disables conversion
    lm_angle_tolerance: 0.008726646259971648  # [motor rad] 0.5 degree = ~0.06 mm carriage, matches firmware lm_arm (was 2)

    # Gripper uses a separate Bool command: true=close/grasp, false=open/release.
    # Gripper follows the five IK joints as the final OpenCR channel.
    # Measured: open at 94 degrees; fully closed at either -53.1 or 234 degrees.
    # Use the 234-degree closing branch (140 degrees from open).
    # 5-degree margin inside the measured -53.1 to 234 degrees; grasp is detected by current,
    # so the close target need not reach the hard stop. Original: min -0.9267698328089891,
    # max/close 4.084070449666731 [rad].
    gripper_min_angle: -0.8395  # -48.1 degrees, 4 decimals rounded inward
    gripper_max_angle: 3.9968  # 229 degrees, 4 decimals rounded inward
    gripper_open_angle: 1.6406  # 94 degrees
    gripper_close_angle: 3.9968  # 229 degrees (= gripper_max_angle)
    # Confirmed raw + closes/grasps; raw - opens.
    gripper_mapping_confirmed: true
    gripper_angle_tolerance: 0.03490658503988659  # [motor rad] 2 degrees, same as every motor
    # Firmware appends gripper_current_a [A]; calibrate its model-specific scale and these thresholds.
    # All-zero values disable current-based grasp estimation.
    grasp_current_threshold_a: 0.1  # [A] 100 mA
    grasp_current_debounce: 0.1  # [s] current must stay above threshold this long
    # After a grasp is detected the gripper holds (contact angle + this) instead of driving on to
    # gripper_close_angle: a stalled jaw at full current trips the DYNAMIXEL overload error.
    gripper_grasp_squeeze_angle: 0.0349  # [motor rad] 2 degrees
