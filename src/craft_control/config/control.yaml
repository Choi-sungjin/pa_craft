# ControlMaster reads these parameters and passes them to the actuator controllers.
# ros2 run craft_control control_master --ros-args --params-file $(ros2 pkg prefix craft_control)/share/craft_control/config/control.yaml
# Every OpenCR reports the same USB serial (FFFFFFFEFFFF), so ttyACM0/1 order is not fixed and by-id
# cannot tell them apart. Pin each board by USB port: ls -l /dev/serial/by-path/

control_master:
  ros__parameters:
    wheel_heading_tolerance: 0.5
    wheel_rotate_angular_speed: 0.6  # [rad/s] in-place turn before tracking/final alignment
    settle_time_s: 0.1
    stop_position_tolerance_rad: 0.002
    wheel_stop_tolerance_rad_s: 0.02
    task_timeout_s: 30.0
    odom_timeout_s: 0.5
    # TODO: update port names
    arm_lm_port: /dev/ttyACM0    # LM + four rotational arm motors + gripper OpenCR
    clock_wheel_port: /dev/ttyACM1  # clock + wheel x2 OpenCR

    # /planning/hold is a live heartbeat: true or missing/stale input holds every axis.
    # Resume requires fresh false, /control/planning_held=false, then new targets.
    planning_watchdog_timeout_s: 0.5
    require_planning_heartbeat: true
    # Each OpenCR must supply a valid sample within this steady-clock interval.
    # A previously seen board that times out reports state=2 until fresh feedback returns.
    serial_feedback_timeout_s: 0.5

    # TurtleBot3 Waffle Pi drive parameters.
    wheel_radius: 0.033  # [m] nominal Waffle Pi wheel radius
    wheel_separation: 0.288  # [m] left/right wheel center-to-center distance
    # Wheel dead reckoning -> /wheel/odom. robot_localization (craft_perception/config/ekf.yaml)
    # fuses it with /imu/data and owns odom->base_link, so publish_odom_tf stays false then.
    odom_frame: odom
    base_frame: base_link
    publish_odom_tf: false
    # Rough floor: wheels slip, so trust wheel speed loosely and wheel yaw rate barely (EKF ignores it).
    wheel_vx_variance: 0.0025      # [(m/s)^2] ~0.05 m/s std
    wheel_vyaw_variance: 0.25      # [(rad/s)^2]
    # OpenCR on-board IMU (raw board frame). Mounting incl. upside-down is the bringup TF.
    imu_frame: imu_link
    imu_gyro_variance: 0.0001      # [(rad/s)^2] ~0.01 rad/s std; IMU yaw rate is the trusted source
    imu_accel_variance: 0.04       # [(m/s^2)^2]
    # Residual gyro offset left after the firmware's power-up zero calibration [rad/s], board frame.
    # Measure: robot still, average /imu/data angular_velocity for ~30 s.
    imu_gyro_bias: [0.0, 0.0, 0.0]
    max_v: 0.26           # [m/s] nominal Waffle Pi maximum linear speed
    # Host limits target speed. OpenCR firmware must configure DYNAMIXEL Profile Acceleration(108)
    # and owns the motor velocity PID, feedforward, acceleration profile, and motor-level tracking.
    # Profile Acceleration must be nonzero; zero makes target-velocity changes effectively immediate.
    # TODO: confirm the wheel angular-speed limit for this robot's motors/gearing.
    max_wheel: 7.8        # [rad/s] project starting value at the wheel
    # Pure Pursuit tuning: path and odometry must use the same frame, at the axle center.
    lookahead_distance: 0.3  # [m] starting value; tune on the robot
    wheel_goal_tolerance: 0.03  # [m] stop when the path endpoint is within this distance
    # Incoming straight path segments are subdivided at path_spacing without changing geometry
    # and republished on /control/tracking_path. Keep it well below lookahead.
    path_spacing: 0.02  # [m]

    # 12-slot puck storage: 0 motor rad = slot 12; positive CCW increases slot numbers.
    # Adjacent slots are 30 motor degrees (pi/6 rad); shortest rotation is chosen.
    # OpenCR must accept/report unwrapped motor radians (e.g. 12 -> 7 commands -5*pi/6).
    clock_slot_count: 12
    clock_slot_angle: 0.5235987755982988  # [motor rad/slot] 30 degrees
    clock_zero_angle: 0.0  # [motor rad] slot 12 alignment
    clock_direction: 1.0  # +1: CCW motor rotation increases slot numbers; -1: reverse
    clock_angle_tolerance: 0.03490658503988659  # [rad] 2 degrees; tune alignment tolerance

    # Rotational arm motors only: shoulder, elbow, wrist_pitch, tool_roll [motor rad].
    # TODO: replace these placeholder limits with measured limits in both host and firmware config.
    arm_min_angle: [-3.14, -1.57, -1.57, -1.57]
    arm_max_angle: [3.14, 1.57, 1.57, 1.57]

    # Rotational part of /ik_solution; ControlMaster routes slide_joint to LmController.
    arm_ik_joint_names: [shoulder_joint, elbow_joint, wrist_pitch_joint, tool_roll_joint]
    arm_ik_mapping_confirmed: false
    # TODO: calibrate direction and zero offset in IK output order against the URDF's q=0 pose.
    arm_joint_directions: [1.0, 1.0, 1.0, 1.0]
    arm_joint_offsets: [0.0, 0.0, 0.0, 0.0]
    arm_angle_tolerance: 0.03490658503988659  # [motor rad] 2 degrees per joint, same as every motor

    # Independent LM controller: target displacement [m] -> motor angle [rad].
    lm_linear_joint_name: slide_joint
    lm_mapping_confirmed: false
    lm_min_angle: 0.0  # [motor rad] preserved from the former first arm channel
    lm_max_angle: 0.3  # [motor rad] TODO: measure actual motor travel limits
    lm_motor_direction: 1.0
    lm_motor_offset: 0.0  # [motor rad]
    # TODO: measure pulley radius [m] and motor-radians per pulley-radian ratio.
    lm_pulley_radius: 0.0
    lm_gear_ratio: 0.0
    lm_angle_tolerance: 0.03490658503988659  # [motor rad] 2 degrees, same as every motor

    # Gripper uses a separate Bool command: true=close/grasp, false=open/release.
    # Gripper follows the five IK joints as the final OpenCR channel.
    # TODO: measure gripper travel limits.
    gripper_min_angle: -3.14
    gripper_max_angle: 3.14
    gripper_open_angle: 0.0
    gripper_close_angle: 0.0
    gripper_mapping_confirmed: false
    gripper_angle_tolerance: 0.03490658503988659  # [motor rad] 2 degrees, same as every motor
    # Firmware appends gripper_current_a [A]; calibrate its model-specific scale and these thresholds.
    # All-zero values disable current-based grasp estimation.
    grasp_current_threshold_a: 0.0
    grasp_current_debounce: 0.0
