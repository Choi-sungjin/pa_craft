# ControlMaster reads these parameters and passes them to the actuator controllers.
# ros2 run craft_control control_master --ros-args --params-file $(ros2 pkg prefix craft_control)/share/craft_control/config/control.yaml
# Every OpenCR reports the same USB serial (FFFFFFFEFFFF), so ttyACM0/1 order is not fixed and by-id
# cannot tell them apart. Install config/udev/99-craft-opencr.rules; keep USB ports fixed.

control_master:
  ros__parameters:
    camera_distance_max_speed: 0.02
    camera_distance_kp: 10.0
    wheel_heading_tolerance: 0.5
    wheel_rotate_angular_speed: 0.72  # [rad/s] in-place turn before tracking/final alignment (user 2026-11-13: +20 %, was 0.6)
    wheel_goal_rotate_angular_speed: 0.25  # [rad/s] in-place turn at the goal (final heading); user 2026-11-10: 0.57 overshot and slid off a stage point
    wheel_goal_rotate_min_speed: 0.10      # [rad/s] slowest in-place turn at the goal, near the heading (user 2026-11-10: slow down into the heading; 0.15 overshot 0.87 deg, 0.06 too slow)
    settle_time_s: 0.1
    stop_position_tolerance_rad: 0.002
    wheel_stop_tolerance_rad_s: 0.02
    # Clock (steering) angle settle: its feedback jitters past stop_position_tolerance_rad (0.002) at rest, which
    # restarted the settle timer every sample (2026-11-10, noboxes runs: settled_for 0.00-0.04 s, stage stop
    # "box stop acknowledgement timeout"). 0.01 rad provisional: the diagnostic line prints clock vs anchor to measure.
    clock_stop_tolerance_rad: 0.01
    arm_lm_port: /dev/opencr_arm_lm    # LM + four rotational arm motors + gripper OpenCR
    clock_wheel_port: /dev/opencr_wheel_clock  # clock + wheel x2 OpenCR

    # Loop rate and timeouts (control_hz, task/odom/heartbeat/serial/teleop): craft_bringup/config/rates.yaml.
    require_planning_heartbeat: true

    # 4WD skid steer drive (rear wheels follow their side in firmware). Measured 2026-10-30:
    # left/right outer faces 0.307 m, wheel width 0.018 m. Chassis changed 2026-10-31: axles 0.16 m apart.
    wheel_radius: 0.033  # [m] nominal Waffle Pi wheel radius
    wheel_track: 0.289  # [m] left/right wheel center-to-center distance (0.307 - 0.018; was wheel_separation 0.288)
    wheelbase: 0.16  # [m] front/rear axle center distance (2026-10-31; was 0.230)
    # Turning scrubs the wheels sideways, so the chassis turns less than the wheel speed difference says:
    # effective separation = skid_steer_factor * wheel_track (controller, teleop; odometry without
    # wheel_yaw_rate_coeffs). 0: geometric estimate 1 + (wheelbase / wheel_track)^2 = 1.31 here.
    # Measured 2026-10-31 (test/drive/turn_map.py, in place, D 0.5..14, 2 spots x CW/CCW, IMU yaw rate):
    # yaw rate = 0.099025 * (wr - wl), linear, = r / (factor * track) -> 1.153 (0.333 m). Was 0 (1.63 with
    # the old 0.230 m axles), which turned 1.4x faster than commanded. Must be 0 or >= 1.
    skid_steer_factor: 1.153
    # Wheel dead reckoning -> /control/wheel/odom. robot_localization (craft_perception/config/ekf.yaml)
    # fuses it with /control/imu/data and owns odom->base_link, so publish_odom_tf stays false then.
    odom_frame: odom
    base_frame: base_link
    publish_odom_tf: false
    # Rough floor: wheels slip, so trust wheel speed loosely and wheel yaw rate barely (EKF ignores it).
    wheel_vx_variance: 0.0025      # [(m/s)^2] ~0.05 m/s std
    # Measured 2026-10-31 against the IMU (teleop, test/drive/odom_compare.py): yaw rate error 0.034 rad/s
    # rms, CW/CCW off by up to 3 %, one stall at 0.27 rad/s (wheels turning, chassis not). 0.1 rad/s std
    # covers the first two; stalls stay the slip detector's job. Unused while ekf.yaml skips wheel vyaw.
    wheel_vyaw_variance: 0.01      # [(rad/s)^2] (was 0.25)
    # Slip: wheel odometry yaw rate vs the wheel board gyro (offset tracked while the wheels stand still).
    # Apart by more than the threshold -> both wheel twist variances x slip_variance_scale for slip_hold_s.
    # 0.1 rad/s: the 2026-10-31 teleop stall (wheels 0.28, chassis 0.015 rad/s) crossed it for 1 s; normal
    # driving stayed at 0.034 rad/s rms. Yaw slip only: straight-line wheel spin is left to the LiDAR x/y.
    slip_yaw_rate_threshold: 0.1   # [rad/s]
    slip_hold_s: 0.5               # [s]
    slip_offset_gain: 0.02         # per still feedback sample (50 Hz: ~1 s)
    slip_variance_scale: 100.0
    # In-place turns slip unevenly, so the mean wheel speed is slip, not travel: report 0 m/s when the
    # wheels turn opposite and |wl + wr| < this * |wr - wl| (yaw already comes from the IMU). 0 disables.
    wheel_in_place_ratio: 0.3
    # Wheel odometry yaw rate from the measured in-place turn map instead of the skid steer separation:
    # sign(D) * sum(c_k * |D|^k), D = wr - wl [rad/s] (wheel feedback). Fit by test/drive/turn_map.py poly
    # on 2026-10-31 (wheelbase 0.16 m; spots 1-2 x CW/CCW averaged, D 0.45..14): degree 1 had the lowest
    # leave-one-out error (higher degrees fit noise), residual <= 0.0034 rad/s; = skid_steer_factor 1.153.
    # Checked 2026-10-31: IMU scale 0.999 on both boards (5 turns onto a tape line, test/gyro_scale), so
    # the IMU reference holds. Wheel yaw / true over 5 turns in place: CCW 1.015, CW 0.972; teleop arcs
    # vs IMU 0.994 (CCW 0.977, CW 1.019). The CW/CCW split is left for a load change (one map for now).
    # Remove the line (an empty [] has no type in ROS 2 params) to go back to radius * (wr - wl) / separation.
    wheel_yaw_rate_coeffs: [0.099025]
    # Both OpenCR on-board IMUs are relayed raw on /control/imu/{wheel_clock,lm_arm} (board frame,
    # gyro offset included); craft_perception's imu_processor turns them into the chassis yaw rate.
    max_v: 0.26         # [m/s] nominal Waffle Pi maximum linear speed
    # Speed-up cap of the forward command [m/s^2] = planning path_planner.a_lon_max. The wheel boards follow steps at
    # once (Profile Acceleration at its maximum, 2026-11-08): planning's speed profile shapes speeding up and slowing
    # down; this only covers starts the profile cannot see (resume after a pause, the end of an in-place turn).
    max_accel: 0.25
    # Host limits target speed. OpenCR firmware configures DYNAMIXEL Profile Acceleration(108) (wheels: maximum, steps
    # are followed at once) and owns the motor velocity PID, feedforward, and motor-level tracking.
    # Wheels: XM430-W210; project speed cap below (not a guaranteed loaded speed).
    max_wheel: 7.8        # [rad/s] wheel output-shaft speed cap
    # Pure Pursuit tuning: path and odometry must use the same frame, at the chassis turning center
    # (midway between the front and rear axles on 4WD).
    # 0.3 cut the S curve at gain 1.2 (bag g12_1506: +76 mm at (2.13, -2.21)); 0.18 at 0.12 m/s: RMSE 17 mm
    # (la18_1521). 0.25 on trial with cruise_speed 0.26 (2026-11-02).
    # Lookahead at the driven speed (wheel feedback): linear between the points, held at the ends. Speeds increase.
    # Tune per speed on the robot (2026-11-08: 0.12 -> 0.18 measured, 0.26 -> 0.25 first guess).
    # 2026-11-09 시험: 저속 최소값 0.18 m + 연속 목표점 보간. 차체 앞면 0.2097 m보다 짧다.
    # 방향 추정 편향이 있으면 L*tan(b) 잔류 오차가 생길 수 있으므로 20 mm 최종 허용치를 실주행으로 확인한다.
    lookahead_speeds: [0.05, 0.12, 0.26]     # [m/s]
    lookahead_distances: [0.18, 0.18, 0.25]  # [m]
    # Multiplies the Pure Pursuit turn command (not the in-place turn). bag roi_1422 (2026-11-02): lateral
    # error RMSE 33 mm, max 77 mm, mostly to the outside after corners (under steer) -> 1.2. 1.0 = plain PP.
    # 1.0 since 2026-11-11 (was 1.2, the same at every bearing): the gain is wheel_tracking_gain_scales below alone.
    wheel_tracking_gain: 1.0
    # Heading offset added to the pose yaw for path tracking (2026-11-11, not driven yet). 14 tour laps over 4.5 h:
    # yaw - travel direction = -3.2 deg median (-2.9 to -3.5 per complete lap), -4.5 driving up the map, -0.7 driving
    # down. +3 centres it; what is left (+-2 deg by place and direction) is the lateral integral's. Not used in a box
    # dock, camera distance mode or the goal heading alignment. 0 = off. Measure again after a new map or LiDAR mount.
    # 3.0 -> 1.0 (2026-11-12): 2 deg of it went into the LiDAR mount yaw (lidar_processor.launch.py front_yaw_deg 178,
    # rear_yaw_deg -2), so the pose yaw itself reads 2 deg less to the right. Keep the sum at what the laps measure.
    # 1.0 -> 0.0 (2026-11-12): the whole 4.3 deg is in the LiDAR mount yaw now (front_yaw_deg 175.7, rear_yaw_deg -4.3).
    # What is left by place and direction (+-1 to 1.5 deg) is the lateral integral's. Set it again from a tour lap
    # (tools/tracking_rmse/tour_report.py, heading offset median) if that is not near 0.
    wheel_heading_offset_deg: 0.0
    # Turn gain by the bearing of the lookahead point off the heading (adaptive): linear between the entries, held at
    # the ends. [0.0] -> [1.2] = the constant 1.2 used until 2026-11-11.
    # tour_h3 laps (fixed 1.2 times [0.7, 1.0], so 0.84 near the path): mean offset 0 but the spread inside the first
    # 1.5 m of a leg went from 1.0 to 1.3-1.4 cm. Now (not driven yet): plain Pure Pursuit (1.0) within 1 deg, 1.2 from
    # 3 deg. Above 1.2 at large bearings is untried: the turn follows 0.1 s late and overshoots.
    wheel_tracking_gain_errors_deg: [1.0, 3.0]
    wheel_tracking_gain_scales: [1.0, 1.2]
    # Lateral error integral on Pure Pursuit (2026-11-11, not driven yet): curvature -= integral, the integral grows by
    # gain * offset [m] * distance driven [m], within +-limit. Tour bags: the pose heading reads 2-3 deg right of the
    # travel direction, so Pure Pursuit runs lookahead * tan(that) = +0.9 cm left on every straight (cruise RMSE 1.43 cm).
    # Ideal simulation (3 deg, lookahead 0.25, no turn delay; test LateralIntegralRemovesTheOffsetOfAHeadingBias): 13 mm
    # without it; gain 15 leaves 5.9 mm after 2 m and 1.2 mm after 5 m; gain 100 is within 1.2 mm after 1 m with a small
    # overshoot. The real turn delay (0.1 s) makes high gains weave sooner: start at 30. 0 = off (plain Pure Pursuit).
    # Box docks and camera distance mode never use it.
    # Laps 2026-11-11: off RMSE 1.43 cm, mean +0.9; 30 -> 1.28, +0.5; 60 -> 1.27, +0.4 but the path is crossed 1.4-1.8
    # times per m instead of 1.0-1.1 (weaving). Back to 30 with wheel_heading_offset_deg taking the fixed part.
    wheel_lateral_integral_gain: 30.0  # [1/m^3]
    wheel_lateral_integral_limit: 1.0  # [1/m] holds 2 * tan(b) / lookahead: 3 deg needs 0.42, 5 deg 0.70 (lookahead 0.25)
    wheel_goal_tolerance: 0.10  # [m] stop when the path endpoint is within this distance, matches planning goal_tolerance (was 0.03: below SLAM pose noise, overshoot -> 180 deg turn back)
    # Incoming straight path segments are subdivided at path_spacing without changing geometry
    # and republished on /control/tracking_path. Keep it well below lookahead.
    path_spacing: 0.02  # [m]

    # Wheel polarity is corrected in firmware/wheel_clock/config.h:
    # wheel_l ID 1 direction=+1, wheel_r ID 2 direction=-1; hardware Reverse OFF.
    # Both host wheel commands/feedback are positive for forward travel.

    # 12-slot puck storage: slot 12 = 166.4 raw motor degrees, aligned with the loading guide
    # (2026-11-03 after hardware reassembly, rechecked; was 165.5, 210.0, 314.6 before 2026-10-26).
    # Positive motor rotation is CCW viewed from above.
    # Adjacent slots are 30 motor degrees (pi/6 rad); shortest rotation is chosen.
    # OpenCR must accept/report unwrapped motor radians (e.g. 12 -> 7 commands -5*pi/6).
    clock_slot_count: 12
    clock_slot_angle: 0.5235987755982988  # [motor rad/slot] 30 degrees
    clock_zero_angle: 1.316156  # [motor rad] 75.4 degrees, slot 12 at the loading guide (2026-11-11, checkwheel reading with the clock set at 12; was 164.4, 135.2, 45.4, 44.8, 73.9, 166.4)
    # Firmware clock zero_tick stays 0: apply this offset here only.
    # Recheck physical alignment after a motor power cycle/multi-turn reset.
    clock_direction: 1.0  # +1: CCW motor rotation increases slot numbers; -1: reverse
    clock_angle_tolerance: 0.03490658503988659  # [rad] 2 degrees; tune alignment tolerance

    # Rotational arm motors only: shoulder, elbow, wrist_pitch, tool_roll [motor rad].
    # Measured degrees: shoulder 44.6–185, elbow 36.3–309.2 (new bracket, 2026-11-06; was 35.2–320.6),
    # wrist_pitch -110.7–152.1 (2026-11-06 after the reassembly; was -16.7–250.5), tool_roll -234.1–247.8
    # (2026-11-02; was 39–187, 38–323, 70.1–340, -180–180).
    # Limits below keep a 5-degree margin inside those (sync is approximate):
    # shoulder 49.6–180, elbow 41.3–304.2, wrist_pitch -105.7–148.1 (upper end 4 deg inside: the clock pick, 2026-11-06). tool_roll stays -175–175: a range
    # over one turn would make the firmware boot unwrap ambiguous.
    # Rounded inward to 4 decimals: ControlMaster sends '%.4f', and the firmware rejects a whole
    # frame if any value falls outside its limits, so limits must be exactly representable.
    # The lying-puck grasp (URDF elbow 196.4, wrist -135.1 deg) stays inside these limits.
    arm_min_angle: [0.8657, 0.7209, -1.8448, -3.0543]
    arm_max_angle: [3.1415, 5.3092, 2.5848, 3.0543]

    # Rotational part of /ik_solution; ControlMaster routes slide_joint to LmController.
    arm_ik_joint_names: [shoulder_joint, elbow_joint, wrist_pitch_joint, tool_roll_joint]
    arm_ik_mapping_confirmed: true
    # motor_angle = offset + direction * URDF joint angle (hardware Reverse OFF).
    # Directions checked against joint_state_publisher_gui: +1 = URDF + and motor raw + move the same way.
    # Offsets from a pose matched in RViz (2026-10-24): raw [90.4, 178.9, 197.3, 184.2] deg at
    # URDF [0.425, 0.934, 0.221, -1.595] rad.
    # Re-zeroed 2026-11-02 at the 2026-10-24 reference pose (LM motor end, shoulder back to its stop,
    # elbow down, wrist up, tool_roll aligned): raw [44.5, 316.5, 72.2, 94.0] deg, was [38.9, 324, 182, -];
    # offset += new raw - old raw, tool_roll aligned = 0. Previous offsets 66.05, 125.39, 209.96, 90.00 deg.
    # wrist_pitch bracket replaced (2026-11-02).
    arm_joint_directions: [1.0, 1.0, -1.0, 1.0]
    # wrist_pitch: the reference-pose value (100.16 deg) tilted the tool ~22 deg toward the robot on hardware
    # (2026-11-02); the hand-set 'wrist up' was not the 2026-10-24 pose. Now from its measured stops (both ends
    # moved -86.8 / -89.5 deg): 209.96 - 88.15 = 121.80 deg. 2026-11-06 reassembly: the stops moved again,
    # -16.7 -> -110.7 and 250.5 -> 152.1 (-94.0 / -98.4 deg): 121.80 - 96.20 = 25.60 deg (+-2.2 from the two ends).
    # 2026-11-06 evening: whole arm held straight up by jog (shoulder-elbow and elbow-wrist axes and the gripper
    # vertical) read raw [91.1, 185.3, 17.3] at URDF [24.00, 52.61, 13.39] deg: offsets 67.10, 132.69, 30.69
    # (were 71.65, 117.89, 25.60; the taught clock grasp and box place then come out with the tool vertical).
    # tool_roll: aligned (jaws front-back) re-measured at raw 90.9 deg (2026-11-03, sis1 failed on the alignment; was 94.00).
    arm_joint_offsets: [1.171116, 2.315877, 0.535642, 1.586504]  # [motor rad] 67.10, 132.69, 30.69, 90.90 deg
    arm_angle_tolerance: 0.008726646259971648  # [motor rad] 0.5 degree per joint, matches firmware lm_arm (was 1, before that 2: up to ~9 mm TCP height at the grasp)

    # Independent LM controller: target displacement [m] -> motor angle [rad].
    lm_linear_joint_name: slide_joint
    lm_mapping_confirmed: true
    # 2026-11-07: timing belt re-tensioned (it slipped a tooth at a time at the idler) and re-fitted. Re-measured
    # after the next power-up: the end away from the motor at 136.2, the motor-side end at 1052.0, clock 12 at 548.3.
    # The travel is the same 102 mm; it now takes 915.8 deg (the old 931.7 counted the belt slipping): see
    # lm_meters_per_rad. With slide zero 63.3 mm from the motor end the 5-degree limits below are slide -38.1 / +62.7 mm,
    # the URDF slide limits.
    # Before: measured 579.6 to 1511.3 degrees (2026-11-05, guide moved; was -399.4 to 509.2, -391.8 to 527.5).
    # 5-degree margin below. Keep equal to firmware/lm_arm/config.h.
    lm_min_angle: 2.4645  # [motor rad] 141.2 degrees, 4 decimals rounded inward (was 10.2032 = 584.6)
    lm_max_angle: 18.2735  # [motor rad] 1047.0 degrees, 4 decimals rounded inward (was 26.2898 = 1506.3)
    # Motor raw + and URDF slide_joint + (axis -X) both move the carriage toward the LM motor.
    lm_motor_direction: 1.0
    # The earlier reported 317.2-degree zero was withdrawn; do not use it.
    # Slide zero stays 63.3 mm from the motor end (URDF slide origin): 1511.3 deg - 63.3 mm
    # (2026-11-05; was 509.2 deg - 63.3 mm = -54.97 deg, before that -11.6 deg). 2026-11-07: 1052.0 deg - 63.3 mm.
    lm_motor_offset: 8.441551859979706  # [motor rad] 483.67 degrees at slide position zero (2026-11-07; was 933.10)
    # Measured 0.102 m travel (rail 164 mm - carriage 62 mm) over 915.8 degrees of motor rotation (2026-11-07, belt
    # re-tensioned; was 931.7 with the belt slipping at the idler, 2026-11-05; before that 908.6, 0.108 m over 919.3).
    lm_meters_per_rad: 0.006381491057364487  # [m/motor rad]; zero disables conversion (was 0.006272587217274227)
    lm_angle_tolerance: 0.008726646259971648  # [motor rad] 0.5 degree = ~0.06 mm carriage, matches firmware lm_arm (was 2)

    # Gripper uses a separate Bool command: true=close/grasp, false=open/release.
    # Gripper follows the five IK joints as the final OpenCR channel.
    # Measured: open at 94 degrees; fully closed at either -53.1 or 234 degrees.
    # Use the 234-degree closing branch (140 degrees from open).
    # 5-degree margin inside the measured -53.1 to 234 degrees; grasp is detected by current,
    # so the close target need not reach the hard stop. Original: min -0.9267698328089891,
    # max/close 4.084070449666731 [rad].
    gripper_min_angle: -0.8395  # -48.1 degrees, 4 decimals rounded inward
    gripper_max_angle: 3.9968  # 229 degrees, 4 decimals rounded inward
    gripper_open_angle: 1.6406  # 94 degrees, full open. A GRIPPER open task may carry joints {gripper: rad} to open
                                # less (sis1 clock release 147.9 deg, demo/puck_pick/execute.py)
    gripper_close_angle: 3.9968  # 229 degrees (= gripper_max_angle)
    # Confirmed raw + closes/grasps; raw - opens.
    gripper_mapping_confirmed: true
    gripper_angle_tolerance: 0.03490658503988659  # [motor rad] 2 degrees, same as every motor
    # Firmware appends gripper_current_a [A]; calibrate its model-specific scale and these thresholds.
    # All-zero values disable current-based grasp estimation.
    grasp_current_threshold_a: 0.1  # [A] 100 mA
    grasp_current_debounce: 0.1  # [s] current must stay above threshold this long
    # After a grasp is detected the gripper holds (contact angle + this) instead of driving on to
    # gripper_close_angle: a stalled jaw at full current trips the DYNAMIXEL overload error.
    gripper_grasp_squeeze_angle: 0.0349  # [motor rad] 2 degrees
