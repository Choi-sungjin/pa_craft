# robot_localization EKF (launched by craft_bringup).
#   ekf_local: /control/wheel/odom + /control/imu/data -> odom->base_link TF, /odometry/local
# slam_toolbox owns map->odom (slam.yaml) and uses odom->base_link as its scan-matching prior;
# perception_master's StateEstimator composes both into /perception/state/odom in map.
# Rough floor: wheels slip, so yaw rate comes from the IMU only; wheels give forward speed.
# The IMU is mounted upside down: base_link->imu_link TF (roll = pi) in craft.launch.py
# rotates it, so these configs stay in base_link terms.
#
# *_config order: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]

ekf_local:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    # Future-date odom->base_link: planning looks up obstacle TF at the scan stamp, which can be newer than
    # the last 50 Hz filter update ("extrapolation into the future" -> obstacles dropped -> init timeout).
    transform_time_offset: 0.05
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /control/wheel/odom
    odom0_config: [false, false, false, false, false, false,
                   true,  true,  false, false, false, false,
                   false, false, false]
    odom0_queue_size: 10

    imu0: /control/imu/data
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_queue_size: 20
