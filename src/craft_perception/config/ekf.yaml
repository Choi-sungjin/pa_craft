# robot_localization dual EKF (launched by craft_bringup).
#   ekf_local : /control/wheel/odom + /control/imu/data            -> odom->base_link TF, /odometry/local
#   ekf_global: /control/wheel/odom + /control/imu/data + SLAM pose -> map->odom TF,      /odometry/global
# slam_toolbox therefore must not publish map->odom (transform_publish_period: 0.0 in slam.yaml).
# Rough floor: wheels slip, so yaw rate comes from the IMU only; wheels give forward speed.
# The IMU is mounted upside down: base_link->imu_link TF (roll = pi) in craft.launch.py
# rotates it, so these configs stay in base_link terms.
#
# *_config order: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]

ekf_local:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /control/wheel/odom
    odom0_config: [false, false, false, false, false, false,
                   true,  true,  false, false, false, false,
                   false, false, false]
    odom0_queue_size: 10

    imu0: /control/imu/data
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_queue_size: 20

ekf_global:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    odom0: /control/wheel/odom
    odom0_config: [false, false, false, false, false, false,
                   true,  true,  false, false, false, false,
                   false, false, false]
    odom0_queue_size: 10

    imu0: /control/imu/data
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_queue_size: 20

    # slam_toolbox scan-matched pose in map (geometry_msgs/PoseWithCovarianceStamped).
    pose0: /perception/lidar/pose
    pose0_config: [true,  true,  false, false, false, true,
                   false, false, false, false, false, false,
                   false, false, false]
    pose0_queue_size: 5
    pose0_rejection_threshold: 5.0  # Mahalanobis; drops scan-match jumps
