planning_master:
  ros__parameters:
    # All application parameters are required and validated by configure().
    map_file: maps/maze.stl
    map_frame: map
    stl_slice_heights: [0.10, 0.20, 0.30]
    occupancy_threshold: 65
    goal_heading_required: false
    mission_file: config/missions.yaml
    loop_hz: 20.0
    # Acquisition age and steady-clock receive watchdogs are checked independently.
    odom_timeout_s: 0.5
    joint_timeout_s: 0.5
    observation_timeout_s: 0.5
    obstacle_timeout_s: 0.5
    require_lidar: true
    joint_state_topic: /control/arm_joints  # Measured URDF joints; requires calibrated control mappings.
    observation_min_confidence: 0.5
    cruise_speed: 0.12  # [m/s]; control also applies chassis/motor limits.
    goal_tolerance: 0.03  # [m]
    heading_tolerance: 0.5  # [rad]; unsupported base rotations fail explicitly.
    fsm:
      ready_timeout_s: 5.0
      compute_timeout_s: 3.0
      execution_timeout_s: 30.0
      feedback_timeout_s: 0.5
      completion_debounce_s: 0.1
      max_compute_retries: 1  # Calculations only, never physical action retries.
    ik:
      urdf: urdf/v75_robot.urdf
      base_frame: base_link
      tip_frame: tool_tcp
      position_tolerance: 0.0001  # [m]
      orientation_tolerance: 0.001  # [rad]
      max_iterations: 300
      max_restarts: 30
    path_planner:
      block_size: 0.05
      res: 0.05
      r_robot: 0.21
      margin: 0.03
      lam: 0.60
      w_prox: 1.0
      prox_band: 0.15
      arc_sample: 0.02
      max_cells: 2000000
      max_expansions: 500000
