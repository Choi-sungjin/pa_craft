# 크래프트 음성: 블루투스 마이크에 WebRTC 잡음 제거·자동 음량(AGC)·저음 차단을 건 가상 마이크 craft_mic_clean.
# PipeWire 본체와 별도 프로세스로 돈다: pipewire -c ~/.config/pipewire/craft-mic-clean.conf (craft-mic-clean.service)
context.properties = {
    log.level = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { nice.level = -11 } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = false
            audio.rate = 16000
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.gain_control = true
                webrtc.extended_filter = false
                webrtc.delay_agnostic = true
                webrtc.voice_detection = false
            }
            capture.props = {
                node.name = "craft_mic_capture"
                target.object = "bluez_input.2C_85_ED_C6_6F_90.0"
                node.passive = true
                node.dont-reconnect = false
            }
            source.props = {
                node.name = "craft_mic_clean"
                node.description = "Craft mic (noise suppression + AGC)"
            }
            sink.props = {
                node.name = "craft_echo_ref"
                node.description = "Craft echo reference (unused)"
                node.passive = true
            }
            playback.props = {
                node.name = "craft_echo_ref_out"
                node.passive = true
                target.object = "bluez_output.2C_85_ED_C6_6F_90.1"
            }
        }
    }
]
