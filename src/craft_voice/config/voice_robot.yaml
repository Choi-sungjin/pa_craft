# craft_voice on the robot (Jetson + Bluetooth speaker/microphone): the cute persona that answers to its name.
# Start: tools/run_voice.sh (no colcon build needed) or
#   ros2 run craft_voice voice_node --ros-args --params-file config/voice_robot.yaml
# Anything not listed here keeps the node default (see voice.yaml for all parameters).
voice_node:
  ros__parameters:
    camera: none                  # voice only; set d435 on the robot to let it also describe what it sees
    use_image: false
    state_mode: template          # state changes in fixed words, at once (GPT thinks when asked and when it notices)
    announce_states: Ready,Run.Execute,Run.Complete,Run.Stopping,Fault
    odom_topic: /control/wheel/odom   # wheel motion; no inferred standstill from missing data
    state_cooldown_s: 8.0
    narrate_period_s: 0.0         # no periodic narration: it speaks when something changes or when called
    style: cute
    menu_file: ~/craft-voice/config/menu.yaml   # "크래프트, 오늘 점심 메뉴 뭐야?" (replace the file every week)
    variety: true                 # further wordings in turn; drives said with distance, count, time
    persona: 귀엽고 발랄한 로봇 친구처럼 짧은 반말 한 문장으로 말해. 이름은 크래프트야. 미션 소개는 하지 마.
    max_chars: 60
    # 질문의 조건을 판단할 여유. 상태 변화는 기존 template 안내를 유지한다.
    reasoning_effort: low
    max_output_tokens: 1200
    gpt_voice_deadline_s: 12.0
    # 전원/음성 서비스 시작 후 API 연결이 확인되면 멜로디 원본을 한 번 재생한다.
    startup_clip: ~/craft-voice-sandbox/recordings/jetson_yeap.wav
    loop_closure_topic: /perception/lidar/slam_toolbox/loop_closure_event
    tts_model: gpt-realtime-2.1
    speech_cache_max: 2000        # every fixed sentence stays (670 with the number pieces, 11-15)
    prepare_fixed: true           # at start, synthesize the fixed sentences the cache lacks (background)
    keep_warm: true               # a speech connection always open: a new sentence starts ~0.5 s sooner
    tts_voice: cedar
    # 2026-11-13 사용자 선택(샘플 B): 외국인 억양처럼 들려서 한국 사람 발음·억양을 지시. 바꾸면 캐시 전체를 다시 합성하고
    # SCV 원본 음성은 ~/craft-voice-sandbox/recordings/scv_original/scv_recache.py 로 다시 넣어야 한다.
    tts_instructions: 한국에서 나고 자란 사람처럼 자연스러운 서울 표준어 발음과 억양으로 말해. 외국어 억양이나 영어식 끝 올림 없이, 받침과 된소리를 또렷하게. 귀엽고 발랄한 로봇 친구처럼 밝게, 짧고 또렷하게 말해. 오류와 멈춤은 차분하게 말해.
    player_command: pw-play --target bluez_output.2C_85_ED_C6_6F_90.1 --volume 1.0 {file}
    stream_player_command: pw-play --target bluez_output.2C_85_ED_C6_6F_90.1 --volume 1.0 --rate {rate} --channels 1 --format s16 -
    listen: true
    # craft_mic_clean = 블루투스 마이크(bluez_input.2C_85_ED_C6_6F_90.0)에 WebRTC 잡음 제거·자동 음량을 건 가상 마이크
    # (config/craft-mic-clean.conf, 사용자 서비스 craft-mic-clean.service). 2026-11-13 잡음 RMS 215 → 4. 없으면 기본 마이크.
    mic_command: pw-record --target craft_mic_clean --rate 16000 --channels 1 --format s16 -
    wake_words: 크래프트
    # "젯슨" 호출 전용: 시즈탱크 원본 멜로디/짧은 대답 중 하나를 같은 확률로 재생(연속 중복 가능).
    # '=' 오른쪽의 '|'는 녹음 후보 구분. 상태·동작 안내와 "크래프트" 호출에는 적용하지 않는다.
    word_reactions: "젯슨|제슨|제트슨|젯선|jetson|제이슨|jason=~/craft-voice-sandbox/recordings/jetson_yeap.wav|~/craft-voice-sandbox/recordings/jetson_short_tank_original.wav"
    # 블루투스 통화 마이크는 목소리가 작고 흐려서, 힌트 없이는 글자 변환이 비었다(2026-11-13 시험: 5번 중 0).
    # gpt-transcribe + 힌트 "크래프트": 5번 중 3, 잡음 10개 오인식 0. gpt-4o-mini-transcribe 는 힌트를 주면 잡음도
    # 전부 "크래프트"로 적어서(10개 중 10) 예비 목록에서 뺐다.
    stt_model: "gpt-transcribe,whisper-1"
    stt_prompt: 크래프트, 젯슨
    # 2026-11-13 마이크 잡음 RMS ~240(조용할 때), 말소리가 작아 받아쓰기 11번 중 7번이 빈 글자 → 받아쓰기 전에 말소리를
    # 최대 10배까지 키우고(최대 진폭 0.8), 말로 치는 기준을 잡음의 2.5배 → 1.8배로 낮춤. listen_log_heard 는 진단용.
    stt_peak: 0.8
    stt_max_gain: 10.0
    vad_loud_ratio: 1.8
    listen_log_heard: true
    listen_save_dir: ~/craft-voice-sandbox/heard   # 진단용(최근 60개), 끝나면 '' 로
    follow_up_s: 6.0
    notice: true
    # 혼잣말(NPC처럼): 일하지 않고 서 있을 때 평균 5분(±40%)마다 정해 둔 한마디. 0 = 끔. 문장은 craft_voice/chatter.py.
    # 혼잣말 차례마다 1%로 힙합 녹음. 일반 문장 순환에는 포함하지 않는다.
    chatter_period_s: 300.0
    # rerouted: another path was found after an obstacle and the drive goes on at once ("나이사~").
    announce_situations: replan,blocked,rerouted
    # Recordings made earlier (craft-voice-sandbox): the path search reaction, the step cheer, the finale.
    # wake = the answer to the name alone ("짜스!").
    reactions: "chatter_rap=~/craft-voice-sandbox/recordings/slam_hiphop.wav,wake=~/craft-voice-sandbox/recordings/jjasseu.wav,replan=~/craft-voice-sandbox/recordings/replanning.cedar.wav,rerouted=~/craft-voice-sandbox/recordings/naisa.wav,step_done=~/craft-voice-sandbox/recordings/jjasseu.wav,run_done=~/craft-voice-sandbox/recordings/mission_complete.angry.wav,idle=~/craft-voice-sandbox/recordings/mission_complete.angry.wav,puck_axis=~/craft-voice-sandbox/recordings/terran/vector_computed.wav,gripcam_measured=~/craft-voice-sandbox/recordings/terran/vector_computed.wav,clock_unload=~/craft-voice-sandbox/recordings/terran/dropship_shelf.wav,heartbeat_lost=~/craft-voice-sandbox/recordings/terran/heart_stopped.wav,firmware_done=~/craft-voice-sandbox/recordings/terran/upgrade_complete.wav,trapped=~/craft-voice-sandbox/recordings/terran/scv_claustrophobic.wav|~/craft-voice-sandbox/recordings/terran/scv_trapped.wav,approach_line=~/craft-voice-sandbox/recordings/terran/tank_gamnida.wav|~/craft-voice-sandbox/recordings/terran/tank_target_pos.wav|~/craft-voice-sandbox/recordings/terran/tank_target_set.wav|~/craft-voice-sandbox/recordings/terran/tank_move.wav|~/craft-voice-sandbox/recordings/terran/tank_forward.wav"
